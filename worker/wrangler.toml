name = "solar-monitor-nube"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

# KV donde vive el historico cifrado. El id se rellena al crear el namespace:
#   npx wrangler kv namespace create HISTORICO
[[kv_namespaces]]
binding = "HISTORICO"
id = "60b0b16ccce14c82bda5626468dad476"

# La credencial NO va aqui. Se guarda como secret:
#   npx wrangler secret put SOLAR_ID
# El id de la planta de Solarman tampoco (el repo es publico):
#   npx wrangler secret put SOLARMAN_PLANTA

# Historico de Solarman: una lectura por hora (el dato en vivo se pide bajo demanda).
# Minuto 2 para dar tiempo al datalogger a subir la lectura de la hora en punto.
[triggers]
crons = ["2 * * * *"]
